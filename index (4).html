function act(a){
  if(!ONLINE)apply(a,null);else if(ME==0)apply(a,0);
  else DB.ref('rooms/'+CODE+'/acts').push(JSON.stringify(a));
}
function apply(a,by){
  const c=S.cur,mine=by==null||c.turn==by;
  if(a.t=='bid'&&mine&&!c.sold&&[2,5,10].includes(a.inc))_bid(a.inc);
  else if(a.t=='pass'&&mine&&!c.sold)_pass();
  else if(a.t=='next'&&c.sold&&S.ph=='auction')_next();
  else if(a.t=='pick'&&S.ph=='coach'&&(by==null||(S.coach[0]?1:0)==by))_pick(a.i);
  else if(a.t=='rematch'&&S.ph=='match')start(false);
}
function sync(){if(ONLINE&&ME===0&&CODE&&PLAYING)DB.ref('rooms/'+CODE+'/state').set(JSON.stringify(S))}
function view(){
  if(S.ph=='auction')render();else if(S.ph=='coach')coachPhase();
  else if(S.ph=='match'&&S.mid!=lastMid)playMatch();
}
async function fbInit(){
  if(DB)return;
  if(FB.apiKey.startsWith('YOUR')){$('view').insertAdjacentHTML('beforeend',"<div class='card'><p>أضف إعدادات Firebase في أعلى هذا الكود (FB) أولاً.</p></div>");throw Error('cfg')}
  firebase.initializeApp(FB);UID=(await firebase.auth().signInAnonymously()).user.uid;DB=firebase.database();
}
function lobby(){
  ONLINE=false;$('hud').innerHTML='';
  $('view').innerHTML=`<div class='card'><h2>لعب أونلاين</h2><input id='nm' class='in' placeholder='اسمك' maxlength='14'>
  <select id='lgs' class='in'><option value='all'>العالم (كل الدوريات والأساطير)</option><option value='eg'>الدوري المصري</option><option value='en'>الدوري الإنجليزي</option><option value='es'>الدوري الإسباني</option><option value='lg'>الأساطير فقط</option></select>
  <button class='btn' onclick='createRoom()'>إنشاء غرفة</button>
  <input id='cd' class='in' placeholder='كود الغرفة' maxlength='5' style='text-transform:uppercase'>
  <button class='btn ghost' onclick='joinRoom()'>انضم بكود</button><button class='btn ghost' onclick='location.reload()'>رجوع</button></div>`;
}
async function createRoom(){
  try{await fbInit()}catch(e){return}
  LG=$('lgs').value;NAMES[0]=$('nm').value.trim()||'المضيف';
  CODE=Math.random().toString(36).slice(2,7).toUpperCase();ME=0;ONLINE=true;
  const r=DB.ref('rooms/'+CODE);
  await r.set({host:UID,lg:LG,name0:NAMES[0],t:Date.now()});
  r.child('name1').on('value',s=>{NAMES[1]=s.val()||'';if(!PLAYING)waitHost()});
  r.child('acts').on('child_added',s=>{try{apply(JSON.parse(s.val()),1)}catch(e){}s.ref.remove()});
  waitHost();
}
function waitHost(){
  $('view').innerHTML=`<div class='card'><p>كود الغرفة</p><div class='code'>${CODE}</div><p>شارك الكود مع صديقك</p><p>${NAMES[1]?NAMES[1]+' انضم':'بانتظار اللاعب الثاني…'}</p>
  <button class='btn' ${NAMES[1]?'':'disabled'} onclick='hostStart()'>ابدأ المزاد</button></div>`;
}
function hostStart(){PLAYING=true;start(false)}
async function joinRoom(){
  try{await fbInit()}catch(e){return}
  const c=$('cd').value.trim().toUpperCase(),nm=$('nm').value.trim()||'الضيف';
  const v=(await DB.ref('rooms/'+c).once('value')).val();
  if(!v)return alert('الغرفة غير موجودة');
  if(v.guest&&v.guest!=UID)return alert('الغرفة ممتلئة');
  CODE=c;ME=1;ONLINE=true;NAMES=[v.name0,nm];LG=v.lg;
  await DB.ref('rooms/'+c).update({guest:UID,name1:nm});
  DB.ref('rooms/'+c+'/state').on('value',s=>{
    if(s.val()){S=JSON.parse(s.val());view()}
    else $('view').innerHTML=`<div class='card'><h2>الغرفة ${c}</h2><p>انضممت. بانتظار ${v.name0} لبدء المزاد…</p></div>`;
  });
}
addEventListener('click',()=>{try{const e=document.documentElement,r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e);if(r&&r.catch)r.catch(()=>{})}catch(x){}},{once:true});
function again(){if(ONLINE)act({t:'rematch'});else start(S.cpu)}
showStart();
</script>
</body>
