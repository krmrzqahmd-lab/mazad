<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>مزاد النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>

html,body{margin:0;background:var(--deep);color:var(--chalk);font-family:Cairo,system-ui,sans-serif;min-height:100%}
#app{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
#hud{display:flex;gap:8px}
.t{flex:1;background:var(--pitch);border:2px solid transparent;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.t span{font:400 28px Lalezar,Cairo,sans-serif;line-height:1.2}
.t small{color:#fffa;font-size:12px}
.t0{color:var(--g)}.t1{color:var(--b)}.t.on{border-color:currentColor}
.card{background:var(--pitch);border-radius:14px;padding:18px;text-align:center}
h1,h2{font-family:Lalezar,Cairo,sans-serif;font-weight:400;margin:4px 0}
h1{font-size:52px;color:var(--g)}h2{font-size:34px}
.rate{font:400 64px Lalezar,Cairo,sans-serif;color:var(--g);line-height:1}
.pos{color:#fffb;font-size:15px}
.bid{margin:10px 0;font-weight:700}
.btn{display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:10px;font:700 18px Cairo,sans-serif;background:var(--g);color:var(--deep);cursor:pointer}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid #fff5}
.btn:disabled{opacity:.3;cursor:default}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.score{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.score b{font:400 56px Lalezar,Cairo,sans-serif;color:var(--chalk)}
.min{text-align:center;color:#fffb}
#log{display:flex;flex-direction:column;gap:6px}
.ev{background:var(--pitch);border-radius:8px;padding:8px 12px;border-right:4px solid}
.ev.t0{border-color:var(--g);color:var(--chalk)}.ev.t1{border-color:var(--b);color:var(--chalk)}
.ev i{font-style:normal;color:#fff9;margin-left:8px}
.sqs{display:flex;gap:8px;align-items:flex-start}
.sq{flex:1;background:var(--pitch);border-radius:10px;padding:8px;font-size:13px}
.sq h3{margin:0;font:400 20px Lalezar,Cairo,sans-serif}
.pl{display:grid;grid-template-columns:34px 1fr 24px;gap:4px;padding:3px 0;border-top:1px solid #fff2}
.pl em{font-style:normal;color:var(--g)}.pl u{grid-column:1/-1;color:var(--red);text-decoration:none;font-size:11px}

.pitch{position:relative;aspect-ratio:3/4;margin-top:6px;border-radius:8px;border:2px solid #ffffff66;display:flex;flex-direction:column;justify-content:space-around;padding:6px 2px;background:repeating-linear-gradient(180deg,#1f7a46 0 12.5%,#1a6a3c 12.5% 25%);overflow:hidden}
.pitch::before{content:'';position:absolute;left:25%;right:25%;bottom:0;height:20%;border:2px solid #ffffff66;border-bottom:0}
.pitch::after{content:'';position:absolute;left:50%;top:-26px;width:52px;height:52px;margin-left:-26px;border:2px solid #ffffff66;border-radius:50%}
.pr2{display:flex;justify-content:space-around;position:relative;z-index:1}
.pk{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.cp{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px Lalezar,Cairo,sans-serif;color:#10200f;border:2px solid #fff}
.cp.c0{background:var(--g)}.cp.c1{background:var(--b)}
.cp.em{background:#0003;border:2px dashed #fff7;color:#fff9;font:700 13px Cairo,sans-serif}.cp.nx{border-color:var(--g);color:var(--g);background:#0005}
.nm{font-size:9px;line-height:1.1;text-align:center;margin-top:2px;text-shadow:0 1px 2px #000}
.in{width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;border:2px solid #fff3;background:#0004;color:var(--chalk);font:700 16px Cairo,sans-serif;text-align:center}.in option{color:#000}.code{font:400 64px Lalezar,Cairo,sans-serif;color:var(--g);letter-spacing:6px}
</style>

function showStart(){

  }else{
    const t=c.turn,wait=(S.cpu&&t==1)||(ONLINE&&t!=ME);
    h=`<div class="card"><div class="pos">${POS[p.pos]} • الجولة ${S.round+1} من 11</div><div class="pc"><div class="pr">${p.r}<small>${POS[p.pos]}</small></div><div class="pf">${p.f}</div><div class="pn">${p.n}</div></div>
    <div class="bid">${c.bid?`أعلى عرض ${c.bid}M من ${S.names[c.holder]}`:'لم يُفتح المزاد بعد'}</div>
    <div class="pos">الدور على ${S.names[t]}</div>`+
    (wait?'<p>'+(S.cpu?'الكمبيوتر يفكر…':'بانتظار '+S.names[t]+'…')+'</p>':`<div class="row">${[2,5,10].map(i=>`<button class="btn" ${c.bid+i>S.money[t]?'disabled':''} onclick="bid(${i})">${c.bid+i}M</button>`).join('')}</div>
    <button class="btn ghost" onclick="pass()">انسحب</button>`)+'</div>';
  }
  $('view').innerHTML=h+fms();
  if(!c.sold&&S.cpu&&c.turn==1)setTimeout(cpuMove,900);
}
function fm(t){
  const rows=[['FWD',3],['MID',3],['DEF',4],['GK',1]];
  return `<div class="sq"><h3 class="t${t}">${S.names[t]}</h3><div class="fm">`+rows.map(([k,n])=>{
    const a=S.team[t].filter(p=>p.pos==k),cp=S.cur&&!S.cur.sold&&S.cur.p.pos==k;
    return '<div class="fr">'+Array.from({length:n},(_,i)=>{const p=a[i];return p?`<div class="sl on"><b>${p.n}</b><em>${p.r}</em></div>`:`<div class="sl${cp&&i==a.length?' nx':''}">${POS[k]}</div>`}).join('')+'</div>';
  }).join('')+'</div></div>';
}
function fm2(t){
  const rows=[['FWD',3],['MID',3],['DEF',4],['GK',1]],ab={GK:'ح',DEF:'د',MID:'و',FWD:'م'};
  return `<div class='sq'><h3 class='t${t}'>${S.names[t]}</h3><div class='pitch'>`+rows.map(([k,n])=>{
    const a=S.team[t].filter(p=>p.pos==k),cp=S.cur&&!S.cur.sold&&S.cur.p.pos==k;
    return "<div class='pr2'>"+Array.from({length:n},(_,i)=>{const p=a[i];return "<div class='pk'>"+(p?`<div class='cp c${t}'>${p.r}</div><div class='nm'>${p.n}</div>`:`<div class='cp em${cp&&i==a.length?' nx':''}'>${ab[k]}</div>`)+'</div>'}).join('')+'</div>';
  }).join('')+'</div></div>';
}
const fms=()=>`<div class='sqs'>${fm2(0)}${fm2(1)}</div>`;
function cpuMove(){
  const c=S.cur;if(c.sold||c.turn!=1)return;
  const lim=Math.min(c.cpuMax,S.money[1]);
  const room=Math.floor(lim-c.bid);
  if(room>=2)bid(Math.min(Math.random()<.35?5:2,room));else pass();
}
function _bid(inc){
  const c=S.cur,t=c.turn,amt=c.bid+inc;if(amt>S.money[t])return;
  c.bid=amt;c.holder=t;c.turn=1-t;
  if(S.money[1-t]<amt+2)return sell(t,amt);
  render();
}
function _pass(){
  const c=S.cur;
  if(c.holder<0){const w=1-c.turn;sell(w,Math.min(2,S.money[w]))}else sell(c.holder,c.bid);
}
function sell(w,price){
  const c=S.cur;S.money[w]-=price;
  S.team[w].push({...c.p,price});c.h=mk(c.p.pos);S.team[1-w].push({...c.h,price:0,hid:1});
  c.sold={w,price};render();
}
function _next(){S.round++;S.round>=11?coachPhase():newRound()}
function coachPhase(){
  S.ph='coach';sync();const t=S.coach[0]?1:0;hud(t);
  $('view').innerHTML=`<div class="card"><h2>اختيار المدرب</h2><p>${S.names[t]}: اختر مدرباً بما تبقى معك. كلما كان أغلى رفع مستوى الفريق أكثر.</p>`+
  C.map((k,i)=>`<button class="btn ${k.c?'':'ghost'}" ${(k.c>S.money[t]||(ONLINE&&t!=ME))?'disabled':''} onclick="pick(${i})">${k.n} (+${k.b}) — ${k.c}M</button>`).join('')+'</div>';
  $('view').insertAdjacentHTML('beforeend',fms());
  if(S.cpu&&t==1)setTimeout(()=>{let b=0;C.forEach((k,i)=>{if(k.c<=S.money[1])b=i});pick(b)},1000);
}
function _pick(i){
  const t=S.coach[0]?1:0;if(C[i].c>S.money[t])return;
  S.coach[t]=C[i];S.money[t]-=C[i].c;
  S.coach[1]?go():coachPhase();
}
function st(t){
  const g=k=>{const a=S.team[t].filter(p=>p.pos==k);return a.reduce((s,p)=>s+p.r,0)/a.length+S.coach[t].b};
  return{gk:g('GK'),def:g('DEF'),mid:g('MID'),fwd:g('FWD')};
}
function scorer(t){
  const a=[];S.team[t].forEach(p=>{if(p.pos=='FWD')a.push(p,p,p);else if(p.pos=='MID')a.push(p)});
  return a[rnd(a.length)];
}
function sim(){
  const A=[st(0),st(1)],sc=[0,0],ev=[];
  Array.from({length:16},()=>1+rnd(90)).sort((a,b)=>a-b).forEach(m=>{
    const a=Math.random()<A[0].mid**8/(A[0].mid**8+A[1].mid**8)?0:1,d=1-a;
    const att=A[a].fwd*.6+A[a].mid*.4,dfn=A[d].def*.6+A[d].gk*.4;
    const p=Math.min(.6,Math.max(.06,.26+(att-dfn)/50)),s=scorer(a);
    if(Math.random()<p){sc[a]++;ev.push({m,t:a,txt:`⚽ هدف! ${s.n}`,s:[...sc]})}
    else ev.push({m,t:a,txt:Math.random()<.5?`تسديدة ${s.n} يتصدى لها الحارس`:`فرصة ضائعة لـ ${s.n}`,s:[...sc]});
  });
  return{ev,sc};
}
function go(){S.res=sim();S.ph='match';S.mid=Date.now();sync();playMatch()}
let lastMid=0;
function playMatch(){
  lastMid=S.mid;hud(-1);const r=S.res;
  $('view').innerHTML=`<div class="card"><div class="score"><span style="color:var(--g)">${S.names[0]}</span><b id="sc">0 - 0</b><span style="color:var(--b)">${S.names[1]}</span></div><div class="min" id="min">صافرة البداية</div></div><div id="log"></div>`;
  let i=0;
  (function step(){
    if(i>=r.ev.length)return setTimeout(()=>fin(r),800);
    const e=r.ev[i++];
    $('sc').textContent=e.s[0]+' - '+e.s[1];$('min').textContent='الدقيقة '+e.m;
    $('log').insertAdjacentHTML('afterbegin',`<div class="ev t${e.t}"><i>${e.m}’</i>${e.txt}</div>`);
    setTimeout(step,650);
  })();
}
function fin(r){
  let [a,b]=r.sc,msg;
  if(a==b){
    const s=[0,1].map(t=>{const x=st(t);return(x.gk+x.def+x.mid+x.fwd)**8});
    const w=Math.random()<s[0]/(s[0]+s[1])?0:1;
    msg=`تعادل ${a} - ${b}، وحسمت ركلات الترجيح الفوز لـ ${S.names[w]}`;
  }else msg=`فاز ${S.names[a>b?0:1]} بنتيجة ${a} - ${b}`;
  const col=t=>`<div class="sq"><h3 class="t${t}">${S.names[t]}</h3><small>${S.coach[t].n}</small>`+
    S.team[t].slice().sort((x,y)=>ORD.indexOf(x.pos)-ORD.indexOf(y.pos)).map(p=>`<div class="pl"><span>${POS[p.pos]}</span><b>${p.n}</b><em>${p.r}</em>${p.hid?'<u>كان مخفياً</u>':''}</div>`).join('')+'</div>';
  $('view').innerHTML=`<div class="card"><h2>${msg}</h2><button class="btn" onclick="location.reload()">لعب من جديد</button></div><div class="sqs">${col(0)}${col(1)}</div>`;
  window.scrollTo(0,0);
}

/* ===== أونلاين (المرحلة 1): غرفة بكود دعوة ===== */
const FB={apiKey:'AIzaSyDvdA60QhQutufjLhBSOu3wYx3tlVDFIKE',authDomain:'krier-ea3d5.firebaseapp.com',databaseURL:'https://krier-ea3d5-default-rtdb.europe-west1.firebasedatabase.app',projectId:'krier-ea3d5',appId:'1:977609793535:web:cc9eb70bbce6a177ee91ca'};
let DB,UID,ONLINE=false,ME=0,CODE,PLAYING=false,NAMES=['',''];
const bid=inc=>act({t:'bid',inc}),pass=()=>act({t:'pass'}),next=()=>act({t:'next'}),pick=i=>act({t:'pick',i});
function act(a){
  if(!ONLINE)apply(a,null);else if(ME==0)apply(a,0);
  else DB.ref('rooms/'+CODE+'/acts').push(JSON.stringify(a));
}
function apply(a,by){
  const c=S.cur,mine=by==null||c.turn==by;
  if(a.t=='bid'&&mine&&!c.sold&&[2,5,10].includes(a.inc))_bid(a.inc);
  else if(a.t=='pass'&&mine&&!c.sold)_pass();
  else if(a.t=='next'&&c.sold&&S.ph=='auction')_next();
  else if(a.t=='pick'&&S.ph=='coach'&&(by==null||(S.coach[0]?1:0)==by))_pick(a.i);
}
function sync(){if(ONLINE&&ME===0&&CODE&&PLAYING)DB.ref('rooms/'+CODE+'/state').set(JSON.stringify(S))}
function view(){
  if(S.ph=='auction')render();else if(S.ph=='coach')coachPhase();
  else if(S.ph=='match'&&S.mid!=lastMid)playMatch();
}
async function fbInit(){
  if(DB)return;
  if(FB.apiKey.startsWith('YOUR')){$('view').insertAdjacentHTML('beforeend',"<div class='card'><p>أضف إعدادات Firebase في أعلى هذا الكود (FB) أولاً.</p></div>");throw Error('cfg')}
  firebase.initializeApp(FB);UID=(await firebase.auth().signInAnonymously()).user.uid;DB=firebase.database();
}
function lobby(){
  ONLINE=false;$('hud').innerHTML='';
  $('view').innerHTML=`<div class='card'><h2>لعب أونلاين</h2><input id='nm' class='in' placeholder='اسمك' maxlength='14'>
  <select id='lgs' class='in'><option value='all'>العالم (كل الدوريات والأساطير)</option><option value='eg'>الدوري المصري</option><option value='en'>الدوري الإنجليزي</option><option value='es'>الدوري الإسباني</option><option value='lg'>الأساطير فقط</option></select>
  <button class='btn' onclick='createRoom()'>إنشاء غرفة</button>
  <input id='cd' class='in' placeholder='كود الغرفة' maxlength='5' style='text-transform:uppercase'>
  <button class='btn ghost' onclick='joinRoom()'>انضم بكود</button><button class='btn ghost' onclick='location.reload()'>رجوع</button></div>`;
}
async function createRoom(){
  try{await fbInit()}catch(e){return}
  LG=$('lgs').value;NAMES[0]=$('nm').value.trim()||'المضيف';
  CODE=Math.random().toString(36).slice(2,7).toUpperCase();ME=0;ONLINE=true;
  const r=DB.ref('rooms/'+CODE);
  await r.set({host:UID,lg:LG,name0:NAMES[0],t:Date.now()});
  r.child('name1').on('value',s=>{NAMES[1]=s.val()||'';if(!PLAYING)waitHost()});
  r.child('acts').on('child_added',s=>{try{apply(JSON.parse(s.val()),1)}catch(e){}s.ref.remove()});
  waitHost();
}
function waitHost(){
  $('view').innerHTML=`<div class='card'><p>كود الغرفة</p><div class='code'>${CODE}</div><p>شارك الكود مع صديقك</p><p>${NAMES[1]?NAMES[1]+' انضم':'بانتظار اللاعب الثاني…'}</p>
  <button class='btn' ${NAMES[1]?'':'disabled'} onclick='hostStart()'>ابدأ المزاد</button></div>`;
}
function hostStart(){PLAYING=true;start(false)}
async function joinRoom(){
  try{await fbInit()}catch(e){return}
  const c=$('cd').value.trim().toUpperCase(),nm=$('nm').value.trim()||'الضيف';
  const v=(await DB.ref('rooms/'+c).once('value')).val();
  if(!v)return alert('الغرفة غير موجودة');
  if(v.guest&&v.guest!=UID)return alert('الغرفة ممتلئة');
  CODE=c;ME=1;ONLINE=true;NAMES=[v.name0,nm];LG=v.lg;
  await DB.ref('rooms/'+c).update({guest:UID,name1:nm});
  DB.ref('rooms/'+c+'/state').on('value',s=>{
    if(s.val()){S=JSON.parse(s.val());view()}
    else $('view').innerHTML=`<div class='card'><h2>الغرفة ${c}</h2><p>انضممت. بانتظار ${v.name0} لبدء المزاد…</p></div>`;
  });
}
showStart();
</script>
